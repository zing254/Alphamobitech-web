<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="250" cy="225" r="200" fill="url(#bg)" opacity="0.5"/>
  <circle cx="250" cy="225" r="160" fill="url(#bg)" opacity="0.3"/>

  <!-- Phone on left -->
  <rect x="140" y="100" width="100" height="240" rx="20" ry="20" fill="#334155" filter="url(#shadow)"/>
  <rect x="145" y="105" width="90" height="230" rx="16" ry="16" fill="#1E293B"/>
  <rect x="153" y="120" width="74" height="180" rx="6" ry="6" fill="#0F172A"/>
  <!-- Charging indicator on phone -->
  <text x="190" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#60A5FA">⚡</text>

  <!-- Charging port -->
  <rect x="180" y="340" width="20" height="8" rx="2" fill="#475569"/>

  <!-- Cable -->
  <path d="M190,348 C190,370 240,370 260,340" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M190,348 C190,375 250,375 270,335" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Charger block -->
  <rect x="250" y="300" width="60" height="40" rx="10" fill="#334155" filter="url(#shadow)"/>
  <rect x="258" y="308" width="44" height="24" rx="6" fill="#1E293B"/>
  <circle cx="280" cy="320" r="6" fill="#60A5FA" filter="url(#glow)"/>

  <!-- Lightning bolt big -->
  <g transform="translate(310, 180)">
    <path d="M-10,-50 L10,-50 L-15,0 L15,0 L-20,50 L25,0 L-5,0 L15,-50 Z" fill="#60A5FA" filter="url(#glow)"/>
  </g>

  <!-- Energy waves -->
  <g opacity="0.5">
    <path d="M140,200 C130,200 120,210 120,220 C120,230 130,240 140,240" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <path d="M130,180 C115,180 100,195 100,215 C100,235 115,250 130,250" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
    <path d="M370,200 C380,200 390,210 390,220 C390,230 380,240 370,240" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <path d="M380,180 C395,180 410,195 410,215 C410,235 395,250 380,250" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <circle cx="130" cy="150" r="3" fill="#FCD34D" opacity="0.7"/>
  <circle cx="115" cy="170" r="2" fill="#FCD34D" opacity="0.5"/>
  <circle cx="370" cy="130" r="2.5" fill="#FCD34D" opacity="0.6"/>
  <circle cx="385" cy="150" r="2" fill="#FCD34D" opacity="0.4"/>
</svg>