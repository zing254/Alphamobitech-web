<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="batt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="batt2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="250" cy="225" r="200" fill="url(#bg)" opacity="0.5"/>
  <circle cx="250" cy="225" r="160" fill="url(#bg)" opacity="0.3"/>

  <!-- Large battery body -->
  <rect x="160" y="120" width="180" height="220" rx="30" ry="30" fill="#334155" filter="url(#shadow)"/>
  <rect x="170" y="130" width="160" height="200" rx="24" ry="24" fill="#1E293B"/>

  <!-- Battery fill levels -->
  <rect x="178" y="138" width="144" height="48" rx="16" ry="16" fill="url(#batt)" opacity="0.9"/>
  <rect x="178" y="194" width="144" height="48" rx="16" ry="16" fill="url(#batt)" opacity="0.7"/>
  <rect x="178" y="250" width="144" height="48" rx="16" ry="16" fill="url(#batt2)" opacity="0.8"/>
  <rect x="178" y="306" width="144" height="16" rx="8" ry="8" fill="#475569" opacity="0.5"/>

  <!-- Battery top -->
  <rect x="230" y="100" width="40" height="24" rx="6" fill="#475569"/>
  <rect x="236" y="104" width="28" height="16" rx="4" fill="#334155"/>

  <!-- Lightning bolt -->
  <g transform="translate(250, 240)">
    <path d="M-5,-25 L5,-25 L-8,5 L8,5 L-12,35 L15,5 L-5,5 L10,-25 Z" fill="#FCD34D"/>
  </g>

  <!-- Percentage text -->
  <text x="250" y="285" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FCD34D">75%</text>

  <!-- Floating elements -->
  <circle cx="100" cy="160" r="12" fill="#34D399" opacity="0.4"/>
  <circle cx="400" cy="300" r="8" fill="#34D399" opacity="0.3"/>
  <circle cx="90" cy="350" r="6" fill="#FCD34D" opacity="0.5"/>
  <circle cx="410" cy="140" r="10" fill="#FCD34D" opacity="0.3"/>

  <!-- Arrows -->
  <g transform="translate(100, 250)">
    <path d="M0,0 L20,0 M15,-5 L20,0 L15,5" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(380, 250)">
    <path d="M0,0 L-20,0 M-15,-5 L-20,0 L-15,5" fill="none" stroke="#FCD34D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>