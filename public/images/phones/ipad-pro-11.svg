<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="scr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/></filter>
  </defs>

  <!-- iPad body -->
  <rect x="50" y="30" width="300" height="390" rx="16" ry="16" fill="#334155" filter="url(#shadow)"/>
  <rect x="56" y="36" width="288" height="378" rx="12" ry="12" fill="#1E293B"/>

  <!-- Screen bezel -->
  <rect x="70" y="50" width="260" height="340" rx="6" ry="6" fill="url(#scr)"/>

  <!-- Display content - Apple style -->
  <rect x="90" y="200" width="220" height="3" rx="1.5" fill="#475569"/>
  <rect x="90" y="212" width="160" height="3" rx="1.5" fill="#475569"/>
  <rect x="90" y="224" width="180" height="3" rx="1.5" fill="#475569"/>

  <!-- Camera dot -->
  <circle cx="200" cy="62" r="3" fill="#1E293B"/>
  <circle cx="200" cy="62" r="2" fill="#0F172A"/>
  <circle cx="200" cy="62" r="1" fill="#1E293B"/>

  <!-- Home indicator -->
  <rect x="160" y="375" width="80" height="4" rx="2" fill="#475569"/>

  <!-- Apple logo on back -->
  <g transform="translate(200, 240)" opacity="0.07">
    <path d="M0,-15 C-8,-15 -15,-8 -15,0 C-15,8 -8,15 0,15 C8,15 15,8 15,0 C15,-8 8,-15 0,-15 Z" fill="white"/>
  </g>
</svg>