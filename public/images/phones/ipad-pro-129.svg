<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="scr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/></filter>
  </defs>

  <!-- iPad Pro 12.9 body -->
  <rect x="30" y="20" width="340" height="440" rx="16" ry="16" fill="#334155" filter="url(#shadow)"/>
  <rect x="36" y="26" width="328" height="428" rx="12" ry="12" fill="#1E293B"/>

  <!-- Screen -->
  <rect x="50" y="40" width="300" height="390" rx="6" ry="6" fill="url(#scr)"/>

  <!-- Screen content -->
  <rect x="70" y="90" width="260" height="280" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="85" y="105" width="230" height="3" rx="1.5" fill="#475569" opacity="0.5"/>
  <rect x="85" y="118" width="170" height="3" rx="1.5" fill="#475569" opacity="0.3"/>
  <rect x="85" y="131" width="200" height="3" rx="1.5" fill="#475569" opacity="0.3"/>
  <rect x="85" y="250" width="230" height="180" rx="8" fill="#334155" opacity="0.5"/>

  <!-- Camera -->
  <circle cx="200" cy="52" r="4" fill="#1E293B"/>
  <circle cx="200" cy="52" r="2.5" fill="#0F172A"/>

  <!-- Home indicator -->
  <rect x="160" y="415" width="80" height="4" rx="2" fill="#475569"/>
</svg>