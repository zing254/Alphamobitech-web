<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7E7A0"/>
      <stop offset="25%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#B8860B"/>
      <stop offset="75%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F7E7A0"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Main Badge/Icon Area -->
  <g transform="translate(10, 10)">
    <!-- Outer Circle -->
    <circle cx="65" cy="65" r="60" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Inner Ring -->
    <circle cx="65" cy="65" r="52" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
    
    <!-- Phone Icon -->
    <g transform="translate(35, 30)" filter="url(#shadow)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="42" height="70" rx="6" fill="#1a1a2e" stroke="url(#goldGrad)" stroke-width="2"/>
      <!-- Screen -->
      <rect x="4" y="8" width="34" height="48" rx="2" fill="url(#goldGrad)" opacity="0.9"/>
      <!-- Screen Reflection -->
      <rect x="6" y="10" width="10" height="6" rx="1" fill="#fff" opacity="0.4"/>
      <!-- Camera -->
      <circle cx="21" cy="4" r="3" fill="#1a1a2e" stroke="url(#goldGrad)" stroke-width="1"/>
      <circle cx="21" cy="4" r="1.5" fill="url(#goldGrad)"/>
      <!-- Home Button -->
      <circle cx="21" cy="63" r="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
    </g>
    
    <!-- Wrench Overlay -->
    <g transform="translate(78, 45)" filter="url(#shadow)">
      <path d="M8,0 L8,18 M0,18 L16,18" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="8" cy="4" r="3" fill="url(#goldGrad)"/>
    </g>
    
    <!-- Checkmark -->
    <g transform="translate(20, 85)">
      <circle cx="12" cy="12" r="10" fill="#2d5a27"/>
      <path d="M7,12 L10,15 L17,8" stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Company Name -->
  <text x="150" y="55" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="url(#goldGrad)" filter="url(#shadow)">
    Alphamobitect
  </text>
  
  <!-- Tagline -->
  <text x="150" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#F7E7A0">
    Phones Solution Kenya
  </text>
  
  <!-- Decorative Lines -->
  <line x1="150" y1="95" x2="420" y2="95" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Accent Stars -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <circle cx="440" cy="105" r="4"/>
    <circle cx="460" cy="105" r="3" opacity="0.7"/>
    <circle cx="476" cy="105" r="2" opacity="0.5"/>
  </g>
  
  <!-- Tagline Right -->
  <text x="490" y="110" font-family="Arial, sans-serif" font-size="10" fill="#888" letter-spacing="2">
    PREMIUM
  </text>
  <text x="490" y="122" font-family="Arial, sans-serif" font-size="10" fill="#888" letter-spacing="2">
    REPAIRS
  </text>
</svg>
