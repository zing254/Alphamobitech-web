<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="225" r="200" fill="url(#g2)" opacity="0.5"/>
  <circle cx="250" cy="225" r="160" fill="url(#g2)" opacity="0.3"/>

  <!-- Phone body -->
  <rect x="185" y="80" width="130" height="280" rx="24" ry="24" fill="#334155" filter="url(#shadow)"/>
  <rect x="190" y="85" width="120" height="270" rx="20" ry="20" fill="#1E293B"/>

  <!-- Screen with gradient -->
  <rect x="198" y="105" width="104" height="220" rx="8" ry="8" fill="#0F172A"/>
  <rect x="198" y="105" width="104" height="220" rx="8" ry="8" fill="url(#g1)" opacity="0.15"/>

  <!-- Screen content - repair tools icon -->
  <circle cx="250" cy="170" r="25" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <line x1="235" y1="170" x2="265" y2="170" stroke="#D97706" stroke-width="2"/>
  <line x1="250" y1="155" x2="250" y2="185" stroke="#D97706" stroke-width="2"/>

  <!-- Wrench icon on screen -->
  <circle cx="250" cy="230" r="8" fill="#34D399"/>
  <line x1="250" y1="238" x2="250" y2="255" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="242" y1="245" x2="258" y2="245" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Battery indicator -->
  <rect x="228" y="325" width="44" height="16" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <rect x="272" y="329" width="4" height="8" rx="1" fill="#475569"/>
  <rect x="231" y="328" width="25" height="10" rx="1.5" fill="#34D399"/>

  <!-- Floating elements -->
  <g opacity="0.6">
    <!-- Wrench -->
    <g transform="translate(80, 140) rotate(-20)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#D97706" stroke-width="2.5"/>
      <line x1="-10" y1="10" x2="-6" y2="20" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Gear -->
    <g transform="translate(400, 160)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#60A5FA"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#60A5FA" stroke-width="2"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#60A5FA" stroke-width="2"/>
    </g>
    <!-- Screwdriver -->
    <g transform="translate(380, 310) rotate(30)">
      <rect x="-2" y="-20" width="4" height="18" rx="1" fill="#94A3B8"/>
      <rect x="-3" y="2" width="6" height="14" rx="2" fill="#D97706"/>
    </g>
  </g>

  <!-- Checkmark badge -->
  <g transform="translate(310, 290)">
    <circle cx="0" cy="0" r="22" fill="#34D399"/>
    <path d="M-8,0 L-3,6 L8,-6" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="120" cy="280" r="3" fill="#FCD34D" opacity="0.8"/>
  <circle cx="100" cy="300" r="2" fill="#FCD34D" opacity="0.6"/>
  <circle cx="380" cy="120" r="2.5" fill="#FCD34D" opacity="0.7"/>
  <circle cx="400" cy="240" r="2" fill="#FCD34D" opacity="0.5"/>
</svg>